<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Mic Router (Universal Fix)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #06b6d4;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--subtext);
      font-size: 0.88rem;
    }

    .status-badge {
      text-align: center;
      padding: 10px 14px;
      border-radius: 8px;
      background-color: rgba(51, 65, 85, 0.5);
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .status-badge.error {
      color: #fca5a5;
      background-color: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
    }

    .status-badge.success {
      color: #34d399;
      background-color: rgba(16, 185, 129, 0.15);
      border-color: #059669;
    }

    .visualizer-box {
      width: 100%;
      height: 120px;
      background: #060911;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: var(--subtext);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    .btn-main.active {
      background-color: var(--danger);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Headphone Voice Router</h1>
      <p>Direct Mic to Bluetooth Headphone Pass-Through</p>
    </div>

    <div id="statusInfo" class="status-badge">Click "1. Grant Permissions" to detect connected devices</div>

    <button id="grantPermBtn" class="btn-action">1. Grant Permissions & Detect Devices</button>

    <div class="visualizer-box">
      <canvas id="visualizer"></canvas>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="micSelect">Input Microphone (Phone Mic)</label>
        <select id="micSelect">
          <option value="">Permissions pending...</option>
        </select>
      </div>

      <div class="control-group">
        <label for="speakerSelect">Output Headphones / Bluetooth</label>
        <select id="speakerSelect">
          <option value="">Default Audio Output</option>
        </select>
      </div>

      <div class="control-group">
        <label for="volumeRange">Volume Boost / Gain</label>
        <input type="range" id="volumeRange" min="0" max="3" step="0.1" value="1">
      </div>
    </div>

    <button id="startBtn" class="btn-main">2. Start Passthrough Stream</button>
  </div>

  <script>
    let audioContext;
    let micStream;
    let sourceNode;
    let gainNode;
    let analyserNode;
    let animationId;

    // Mobile/Bluetooth Routing Fix ke liye HTML Audio Element
    const audioElement = document.createElement('audio');
    audioElement.autoplay = true;

    const statusInfo = document.getElementById('statusInfo');
    const grantPermBtn = document.getElementById('grantPermBtn');
    const micSelect = document.getElementById('micSelect');
    const speakerSelect = document.getElementById('speakerSelect');
    const volumeRange = document.getElementById('volumeRange');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    // Secure Context Helper & Polyfill
    function getMediaDevices() {
      if (navigator.mediaDevices) {
        return navigator.mediaDevices;
      }
      
      navigator.getUserMedia = navigator.getUserMedia ||
                               navigator.webkitGetUserMedia ||
                               navigator.mozGetUserMedia ||
                               navigator.msGetUserMedia;

      if (navigator.getUserMedia) {
        return {
          getUserMedia: (constraints) => {
            return new Promise((resolve, reject) => {
              navigator.getUserMedia(constraints, resolve, reject);
            });
          },
          enumerateDevices: () => Promise.resolve([])
        };
      }
      return null;
    }

    // Load available audio devices
    async function loadDevices() {
      const mediaDevices = getMediaDevices();

      if (!mediaDevices || !mediaDevices.getUserMedia) {
        statusInfo.className = "status-badge error";
        statusInfo.innerHTML = "⚠️ Browser Secure Context Required!<br>File ko <b>localhost</b> ya <b>HTTPS server</b> par chalaein.";
        return;
      }

      try {
        statusInfo.className = "status-badge";
        statusInfo.textContent = "Requesting mic permissions...";
        
        const tempStream = await mediaDevices.getUserMedia({ audio: true });
        tempStream.getTracks().forEach(track => track.stop());

        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          
          // Inputs (Microphones)
          micSelect.innerHTML = '';
          const inputs = devices.filter(d => d.kind === 'audioinput');
          inputs.forEach((d, i) => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text = d.label || `Microphone ${i + 1}`;
            micSelect.appendChild(opt);
          });

          // Outputs (Headphones / Speakers)
          speakerSelect.innerHTML = '';
          const outputs = devices.filter(d => d.kind === 'audiooutput');
          outputs.forEach((d, i) => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text = d.label || `Headphones/Speaker ${i + 1}`;
            speakerSelect.appendChild(opt);
          });
        }

        statusInfo.className = "status-badge success";
        statusInfo.textContent = "✅ Permissions Granted! Select Bluetooth Headphone and start stream.";
      } catch (err) {
        statusInfo.className = "status-badge error";
        statusInfo.textContent = "Permission error: " + err.message;
        console.error(err);
      }
    }

    grantPermBtn.addEventListener('click', loadDevices);

    // Audio stream routing logic
    async function startAudioStream() {
      const mediaDevices = getMediaDevices();
      if (!mediaDevices) return;

      try {
        const selectedMicId = micSelect.value;
        
        const constraints = {
          audio: {
            deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        };

        micStream = await mediaDevices.getUserMedia(constraints);

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();

        // FIX 1: Auto-resume suspended audio context
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        sourceNode = audioContext.createMediaStreamSource(micStream);
        gainNode = audioContext.createGain();
        analyserNode = audioContext.createAnalyser();

        analyserNode.fftSize = 64;
        gainNode.gain.value = volumeRange.value;

        // Node Connections
        sourceNode.connect(gainNode);
        gainNode.connect(analyserNode);

        // FIX 2: Mobile Bluetooth Output Compatibility Route
        const destinationStream = audioContext.createMediaStreamDestination();
        analyserNode.connect(destinationStream);
        analyserNode.connect(audioContext.destination);

        audioElement.srcObject = destinationStream.stream;
        await audioElement.play();

        // Apply Sink ID for physical Headphones Routing if supported
        if (speakerSelect.value && typeof audioElement.setSinkId === 'function') {
          await audioElement.setSinkId(speakerSelect.value);
        }

        renderVisualizer();

        statusInfo.className = "status-badge success";
        statusInfo.textContent = "🔴 Passthrough Live: Sound active on Bluetooth headphones";
        startBtn.textContent = "Stop Stream";
        startBtn.classList.add('active');
      } catch (err) {
        statusInfo.className = "status-badge error";
        statusInfo.textContent = "Stream error: " + err.message;
      }
    }

    function stopAudioStream() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      
      audioElement.pause();
      audioElement.srcObject = null;

      cancelAnimationFrame(animationId);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      statusInfo.className = "status-badge";
      statusInfo.textContent = "Status: Stopped";
      startBtn.textContent = "2. Start Passthrough Stream";
      startBtn.classList.remove('active');
    }

    startBtn.addEventListener('click', () => {
      if (audioContext && audioContext.state === 'running') {
        stopAudioStream();
      } else {
        startAudioStream();
      }
    });

    volumeRange.addEventListener('input', (e) => {
      if (gainNode) {
        gainNode.gain.value = e.target.value;
      }
    });

    function renderVisualizer() {
      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      function draw() {
        animationId = requestAnimationFrame(draw);
        analyserNode.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#060911';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = '#38bdf8';
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      }
      draw();
    }
  </script>
</body>
</html>
